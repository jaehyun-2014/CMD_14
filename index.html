}.toolgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.toolcard{background:#242424;border:1px solid var(--line);border-radius:7px;padding:14px}.toolcard h3{margin:0 0 8px;font-size:14px}.toolcard p{color:var(--muted);font-size:12px;line-height:1.5}.toolcard button{margin-top:5px}.progress{height:6px;border-radius:5px;background:#3a3a3a;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:var(--accent);width:42%}.modalback{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#242424;border:1px solid #555555;border-radius:9px;box-shadow:0 12px 36px #0008}.modalhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.modalhead strong{flex:1}.modalbody{padding:16px}.modalfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea{background:#111111;color:var(--text);border:1px solid #505050;border-radius:5px;padding:10px}.field textarea{min-height:190px;resize:vertical;font:13px/1.5 var(--mono)}.toast{position:fixed;right:18px;bottom:18px;background:#252525;border:1px solid #4b4b4b;padding:11px 14px;border-radius:8px;z-index:10;box-shadow:0 8px 30px #0006}.footerline{font-size:10px;color:#627789;text-align:right;padding-top:2px}

/* CMD_14: keep the original dark theme; only reduce the overly-modern styling */
button{
  background:#2b2b2b;
  border:1px solid #858585;
  border-radius:2px;
  box-shadow:none;
}
button:hover{background:#383838;border-color:#d0d0d0}
button:active{background:#222;border-color:#aaa}
button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:1px dotted #eee;

}

.navbtn{border-radius:2px}
.navbtn.active{background:#383838;border-color:#888}

.modal{border-radius:2px;box-shadow:0 4px 12px #0006}
.field input,.field textarea,.pathbox{border-radius:2px}
.toast{border-radius:2px;box-shadow:none}

/* Focused Windows-style terminal polish: preserve the existing dark palette and behavior. */
:root{--bg:#191919;--panel:#202020;--panel2:#292929;--line:#3a3a3a;--text:#f2f2f2;--muted:#b6b6b6;--accent:#f2f2f2}
html,body{background:#191919}
.app{min-height:100%;background:#191919}
.layout{grid-template-columns:176px minmax(0,1fr)}

.termhead button{margin-left:auto;padding:4px 8px;border:1px solid #777;background:#303030;border-radius:3px;color:#eee}
.termhead button:hover{background:#3a3a3a;border-color:#ccc}
.output{padding:14px 15px 8px;font-size:14px;line-height:1.6}
.inputrow{padding:0 15px 14px}
.cmdinput{font-size:14px}

.bottomrow button:hover{background:#353535;border-color:#d0d0d0}
.panel,.statcard,.toolcard{background:#222;border-color:#444;border-radius:4px}
.headrow .pagetitle{font-size:17px;font-weight:600}
.subtitle{color:#aaa}
.pill{background:#292929;border-color:#666;color:#eee}

 .layout{grid-template-columns:52px minmax(0,1fr)}

 .inputrow{padding:0 10px 11px}
}

<body>
<div class="app">
  <div class="layout">
    <aside class="sidebar">
      <button class="navbtn active" data-view="terminal"><span>›_</span><span class="navtext">터미널</span></button>
      <button class="navbtn" data-view="explorer"><span>▣</span><span class="navtext">파일 탐색기</span></button>

    </aside>

        <div class="terminal">
          <div class="termhead"><span class="termglyph">&gt;_</span><span class="termname">CMD_14</span><span class="termstate">COMMAND PROMPT</span><button id="clearBtn" type="button">화면 지우기</button></div>
          <div id="output" class="output" role="log" aria-live="polite"></div>

        </div>
        <div class="bottomrow"><button data-cmd="help">help</button><button data-cmd="dir">dir</button><button data-cmd="tree">tree</button><button data-cmd="cls">cls</button></div>
      </section>
      <section id="view-explorer" class="view hidden">
        <div class="headrow"><div><div class="pagetitle">파일 탐색기</div><div class="subtitle">가상 C: 드라이브의 파일과 폴더를 관리합니다.</div></div><div class="headgrow"></div><button id="newFolder">+ 새 폴더</button><button id="newFile">+ 새 파일</button></div>
        <div class="toolbar"><button id="upDir">↑ 위로</button><div id="explorerPath" class="pathbox">C:\</div><button id="refreshFiles">새로 고침</button></div>
        <div class="panel"><table class="filelist"><thead><tr><th>이름</th><th>유형</th><th>크기</th><th>수정</th><th>작업</th></tr></thead><tbody id="fileRows"></tbody></table><div id="fileEmpty" class="empty hidden">이 폴더는 비어 있습니다.</div></div>
        <div class="footerline">더블 클릭: 폴더 열기 / 파일 편집</div>
      </section>
      <section id="view-history" class="view hidden">
        <div class="headrow"><div><div class="pagetitle">명령 기록</div><div class="subtitle">최근 실행한 명령어를 다시 실행하거나 복사할 수 있습니다.</div></div><div class="headgrow"></div><button id="clearHistory">기록 지우기</button></div>
        <div class="panel" style="margin-top:14px"><div id="historyRows"></div></div>
      </section>
    </main>
  </div>
</div>
<div id="modalHost"></div><div id="toastHost"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const terminalEl = document.querySelector('.terminal');
terminalEl.addEventListener('click', e => { if (!e.target.closest('button') && !window.getSelection()?.toString()) document.querySelector('#cmdInput').focus(); });
const $$ = s => [...document.querySelectorAll(s)];
const STORAGE_KEY = 'cmd14.virtualfs.v1';
const HISTORY_KEY = 'cmd14.commandhistory.v1';
const COLORS = { '0':'#070b10','1':'#183b70','2':'#176b3a','3':'#247c7a','4':'#7b2c2c','5':'#713b79','6':'#a56a28','7':'#dce7ef','8':'#607282','9':'#75aaff','a':'#55d6c2','b':'#72d5df','c':'#ff7777','d':'#e2a4ff','e':'#f0ca75','f':'#ffffff' };
const stamp = () => new Date().toLocaleString();
const norm = p => {
  p = String(p ?? '').replace(/\//g,'\\').trim();
  if (!p) return currentPath;
  if (/^[a-z]:/i.test(p)) p = p.slice(2);
  let parts = p.startsWith('\\') ? [] : currentPath.split('\\').filter(Boolean);
  for (const bit of p.split('\\')) {
    if (!bit || bit === '.') continue;
    if (bit === '..') parts.pop(); else parts.push(bit);
  }
  return '\\' + parts.join('\\');
};
const parent = p => p === '\\' ? null : p.slice(0,p.lastIndexOf('\\')) || '\\';
const base = p => p === '\\' ? 'C:\\' : p.split('\\').pop();
const winpath = p => 'C:' + (p === '\\' ? '\\' : p);
const isChild = (p, dir) => parent(p) === dir;
const makeNode = (type, content='') => ({type, content, created:stamp(), modified:stamp()});
function initialFS(){
 const fs = {'\\':makeNode('dir'),'\\Users':makeNode('dir'),'\\Users\\User':makeNode('dir'),'\\Users\\User\\Desktop':makeNode('dir'),'\\Users\\User\\Documents':makeNode('dir'),'\\Users\\User\\Downloads':makeNode('dir'),'\\Windows':makeNode('dir'),'\\Windows\\System32':makeNode('dir'),'\\Program Files':makeNode('dir'),'\\README.txt':makeNode('file','CMD_14 Web 가상 파일 시스템에 오신 것을 환영합니다.\\n\\n이 드라이브는 브라우저 안에서만 동작합니다. 실제 Windows 파일은 변경하지 않습니다.\\nhelp 명령어로 사용 가능한 명령을 확인하세요.\\n'),'\\Users\\User\\Documents\\notes.txt':makeNode('file','메모 파일입니다.\\n여기 내용을 수정해 보세요.\\n'),'\\Windows\\System32\\cmd14.exe':makeNode('file','[virtual executable] CMD_14 command processor\\n')};
 return fs;
}
let fs;
try { const saved=localStorage.getItem(STORAGE_KEY); fs=saved?JSON.parse(saved):initialFS(); if(!fs['\\']||fs['\\'].type!=='dir') fs=initialFS(); } catch { fs=initialFS(); }
let currentPath='\\Users\\User';
let history=[]; try {history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');if(!Array.isArray(history))history=[];}catch{history=[]}
let histIndex=history.length, outputLines=0, activeView='terminal', titleText='CMD_14';
function saveFS(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(fs));}catch{write('경고: 저장 공간이 부족해 파일 시스템을 저장하지 못했습니다.','warn');}}
function saveHistory(){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(-200)));}catch{}}
function write(text='', cls=''){const out=$('#output');const div=document.createElement('div');div.className='line '+cls;div.textContent=String(text);out.appendChild(div);outputLines++;if(outputLines>2500){while(out.children.length>1800)out.removeChild(out.firstChild);outputLines=out.children.length;}out.scrollTop=out.scrollHeight;}
function clearOutput(){ $('#output').textContent='';outputLines=0; }
function setPrompt(){ /* 프롬프트 UI를 표시하지 않음 */ }
function promptLine(cmd){write(cmd,'command');}
function err(msg){write(msg,'error');}
function success(msg){write(msg,'good');}
function getNode(p){return fs[p]||null;}
function resolveExisting(p){const q=norm(p);return fs[q]?q:null;}
function ensureParent(p){const par=parent(p);return !!par&&fs[par]?.type==='dir';}
function addNode(p,node){if(fs[p])return '이미 같은 이름의 파일 또는 폴더가 있습니다.';if(!ensureParent(p))return '경로를 찾을 수 없습니다.';fs[p]=node;saveFS();return null;}
function removeTree(p){for(const k of Object.keys(fs))if(k===p||k.startsWith(p+'\\'))delete fs[k];}
function listDir(p){return Object.keys(fs).filter(k=>k!=='\\'&&isChild(k,p)).sort((a,b)=>{const A=fs[a],B=fs[b];return (A.type===B.type?0:A.type==='dir'?-1:1)||base(a).localeCompare(base(b));});}
function parseArgs(s){const out=[];let cur='',quote=null,started=false;for(let i=0;i<s.length;i++){const c=s[i];if(quote){if(c===quote){quote=null;}else if(c==='^'&&i+1<s.length)cur+=s[++i];else cur+=c;started=true;}else if(c==='"'||c==="'"){quote=c;started=true;}else if(/\s/.test(c)){if(started){out.push(cur);cur='';started=false;}}else if(c==='^'&&i+1<s.length){cur+=s[++i];started=true;}else{cur+=c;started=true;}}if(quote)throw new Error('따옴표가 닫히지 않았습니다.');if(started)out.push(cur);return out;}
function splitCommand(raw){let quote=null;for(let i=0;i<raw.length;i++){if(raw[i]==='"'||raw[i]==="'"){if(!quote)quote=raw[i];else if(quote===raw[i])quote=null;}else if(raw[i]==='&'&&!quote){if(raw[i+1]==='&')return [raw.slice(0,i).trim(),raw.slice(i+2).trim()];return [raw.slice(0,i).trim(),raw.slice(i+1).trim()];}}return [raw.trim(),null];}
const commandNames=['help','/?','ver','cls','echo','title','color','prompt','dir','cd','chdir','tree','type','copy','xcopy','move','ren','rename','del','erase','mkdir','md','rmdir','rd','find','where','path','pushd','popd','systeminfo','hostname','whoami','date','time','vol','label','explorer','notepad','calc','history','doskey','set','exit','shutdown','format','sfc','ipconfig','ping','assoc','fc','more','attrib','ver','about','resetfs'];
let dirStack=[];
function run(raw, fromHistory=false){
 raw=raw.trim();if(!raw)return;
 if(!fromHistory){history.push(raw);history=history.slice(-200);saveHistory();histIndex=history.length;}
 promptLine(raw);
 try{const [first,rest]=splitCommand(raw);executeSingle(first);if(rest)runChained(rest);}catch(e){err('오류: '+(e.message||'명령을 실행할 수 없습니다.'));}
 renderHistory();
}
function runChained(raw){if(!raw)return;const [first,rest]=splitCommand(raw);try{executeSingle(first);if(rest)runChained(rest);}catch(e){err('오류: '+e.message);}}
function executeSingle(raw){
 if(!raw)return;
 const space=raw.search(/\s/);const cmd=(space<0?raw:raw.slice(0,space)).toLowerCase();const argstr=space<0?'':raw.slice(space).trim();
 let a;try{a=parseArgs(argstr);}catch(e){err(e.message);return;}
 const usage=(s)=>err('사용법: '+s);
 switch(cmd){
 case 'help':case '/?':
  write('CMD_14 Web [Version 14.0.1]','good');write('이 환경은 웹 브라우저 안에서 동작하는 가상 명령 프롬프트입니다.');write('');
  write('파일 및 폴더');write('  dir, cd, tree, type, copy, move, ren, del, mkdir, rmdir, find, where');write('시스템 명령');write('  ver, systeminfo, hostname, whoami, date, time, vol, explorer');write('셸 및 화면');write('  cls, echo, title, color, prompt, history, doskey, set, exit');write('추가');write('  notepad [파일], calc, ipconfig, ping, path, pushd, popd, about');write('');write('명령어는 대소문자를 구분하지 않습니다. 경로에 공백이 있으면 "큰따옴표"로 감싸세요.');write('여러 명령은 & 또는 && 로 연결할 수 있습니다.');break;
 case 'ver':write('CMD_14 Web [Version 14.0.1.26024]');break;
 case 'about':write('CMD_14 Web — 독립형 브라우저 가상 셸. 실제 Windows CMD가 아니며 OS 명령을 실행하지 않습니다.');break;

function newNameDialog(kind){const f=field(kind==='dir'?'새 폴더 이름':'새 파일 이름',kind==='dir'?'새 폴더':'untitled.txt');const body=document.createElement('div');body.append(f.wrap);const cancel=document.createElement('button');cancel.textContent='취소';cancel.onclick=()=>host.textContent='';const create=document.createElement('button');create.textContent='만들기';create.onclick=()=>{const name=f.input.value.trim();if(!name||/[\\/:*?"<>|]/.test(name)||name==='.'||name==='..'){toast('파일 이름을 확인하세요.');return;}const p=norm(name);const e=addNode(p,kind==='dir'?makeNode('dir'):makeNode('file'));if(e){toast(e);return;}host.textContent='';renderExplorer();toast('생성했습니다.');if(kind==='file')openNotepad(p);};const {host}=modal(kind==='dir'?'새 폴더':'새 파일',body,[cancel,create]);f.input.focus();f.input.select();}
function autoComplete(){const input=$('#cmdInput'),value=input.value;const m=value.match(/^(.*\s)([^\\/\s]*)$/);if(m){const prefix=m[1],partial=m[2].toLowerCase();const dirToken=prefix.trim().split(/\s+/).pop();let dir=currentPath;if(dirToken&&['cd','dir','type','del','copy','move','ren','mkdir','rmdir'].includes(dirToken.toLowerCase())){}const candidates=listDir(dir).map(p=>base(p)).filter(n=>n.toLowerCase().startsWith(partial));if(candidates.length){input.value=prefix+'"'+candidates[0]+'"';input.setSelectionRange(input.value.length,input.value.length);}}else{const candidates=commandNames.filter(c=>c.startsWith(value.toLowerCase()));if(candidates.length===1)input.value=candidates[0]+' ';else if(candidates.length>1){write(candidates.join('   '),'dim');}}}
$('#cmdInput').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.currentTarget.value;e.currentTarget.value='';run(v);setPrompt();}else if(e.key==='ArrowUp'){e.preventDefault();if(history.length){histIndex=Math.max(0,histIndex-1);e.currentTarget.value=history[histIndex]||'';}}else if(e.key==='ArrowDown'){e.preventDefault();histIndex=Math.min(history.length,histIndex+1);e.currentTarget.value=history[histIndex]||'';}else if(e.key==='Tab'){e.preventDefault();autoComplete();}});
$('#clearBtn').onclick=clearOutput;const quickHelp=$('#quickHelp');if(quickHelp)quickHelp.onclick=()=>{showView('terminal');run('help');};
$$('[data-cmd]').forEach(b=>b.onclick=()=>{showView('terminal');run(b.dataset.cmd);$('#cmdInput').focus();});
$$('.navbtn[data-view]').forEach(b=>b.onclick=()=>showView(b.dataset.view));
$('#newFolder').onclick=()=>newNameDialog('dir');$('#newFile').onclick=()=>newNameDialog('file');$('#refreshFiles').onclick=renderExplorer;
$('#upDir').onclick=()=>{currentPath=parent(currentPath)||'\\';setPrompt();renderExplorer();};

$('#clearHistory').onclick=()=>{if(confirm('명령 기록을 지울까요?')){history=[];histIndex=0;saveHistory();renderHistory();toast('명령 기록을 지웠습니다.');}};
setPrompt();write('CMD_14 Command Processor [Version 1.0.0]','good');write('(c) CMD_14 Project. All rights reserved.','dim');write('');write('명령어 목록은 help 를 입력하세요.');write('');renderExplorer();renderHistory();
})();
</script>
